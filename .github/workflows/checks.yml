name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: fallow / oxlint / oxfmt
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: oxfmt
        run: pnpm format:check

      - name: Agent skill safety checks
        working-directory: .
        run: node --test .claude/skills/lib/*.test.mjs

      - name: Dependency notices
        working-directory: .
        run: |
          pnpm notices:check
          python3 -m unittest discover -s scripts -p 'test_notices.py'

      - name: oxlint
        run: pnpm lint

      # `fallow health` needs a fresh coverage report, so it runs in the tests
      # workflow instead — these two checks read the sources only.
      - name: fallow dead-code
        run: pnpm exec fallow dead-code

      - name: fallow dupes
        run: pnpm exec fallow dupes

  marketing:
    name: marketing site
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/marketing
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/marketing/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # typecheck, oxfmt, oxlint, vitest and the Vite build — the same gate the
      # deploy workflow relies on before publishing the Worker.
      - name: check
        run: pnpm check

  contract:
    name: wire contract drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # The schema code builds only with `schema`, outside the default gates.
      - name: Lint the contract crate
        run: cargo clippy -p bus --features schema --all-targets -- -D warnings

      # contract/*.schema.json must match the Rust types, and the generated
      # TypeScript must match the schema.
      - name: Schema is current
        run: cargo run -q -p bus --features schema --bin contract -- --check

      # Includes the check that fixtures/board/enums.json lists every variant.
      - name: Contract tests with the schema
        run: cargo test -p bus --features schema

      - name: TypeScript is current
        working-directory: apps/desktop
        run: pnpm contract:check
