// Release packages and the deploy gate, contract version 1 (H-020 §2, §6).
//
// What DevOps and testers send as MCP tools; their schemas are generated
// from these messages (see requests.proto for the rules). The owner rules on
// a package over the WebSocket (`release_rule`), never through a bot.
// Closed values travel as strings: a status, verdict or result a newer daemon
// adds reads as text on an older client rather than failing to decode.
syntax = "proto3";

package hermes.board.v1;

// The project's release packages, newest first.
message ReleaseList {
  string project_id = 1;
}

// One release package in full: items with verdicts, builds, deployments.
message ReleaseGet {
  string release_id = 1;
}

// DevOps: start a package from items in Verify.
message ReleaseCreate {
  string project_id = 1;
  // Unique in the project, e.g. "R-2026-W41" or "0.16.0".
  string name = 2;
  // The version the owner sees, e.g. "0.16.0".
  optional string display_version = 3;
  // Item ids, e.g. "H-017"; each must be in Verify and in no other open package.
  repeated string items = 4;
  // Markdown, compiled from the items' change notes.
  optional string changelog = 5;
  // The package this one succeeds after a mixed ruling or a failed deploy
  // (H-020 §6.1): its shipped items may come along. It is superseded when
  // this one is submitted.
  optional string from = 6;
}

// Lead or DevOps: plan a release as soon as its contents are decided (H-137).
// Its items may be in any open column; each one's live status shows in the
// release, with how many are ready. Nothing is built or frozen until it is
// assembled (ReleaseAssemble).
message ReleasePlan {
  string project_id = 1;
  // Unique in the project, e.g. "0.17.0".
  string name = 2;
  // The version the owner sees, e.g. "0.17.0".
  optional string display_version = 3;
  // Item ids, e.g. "H-137"; each open and in no other open package.
  repeated string items = 4;
  optional string changelog = 5;
}

// Lead or DevOps: add items to a release or take them out before it is
// submitted, recorded as a release event. A planned release takes any open
// item; one being assembled takes items in Verify only, and none once it has
// a build or a test result.
message ReleaseItems {
  string release_id = 1;
  repeated string add = 2;
  repeated string remove = 3;
  // Why the scope changed; the owner reads it.
  optional string reason = 4;
}

// Lead or DevOps: a planned release becomes one being assembled, once every
// item is in Verify. From there: attach builds, test, submit.
message ReleaseAssemble {
  string release_id = 1;
}

// One platform's steps for trying a package, shown to the owner.
message HowToTest {
  // The item the steps are for, when they are for one.
  optional string item_id = 1;
  // e.g. "desktop-mac", "ios".
  string platform = 2;
  repeated string steps = 3;
}

// The whole how-to-test list, where "unset" and "none" must differ.
message HowToTestList {
  repeated HowToTest values = 1;
}

// DevOps: fill in what the owner reads, while the package is assembling.
message ReleaseUpdate {
  string release_id = 1;
  optional string display_version = 2;
  // Markdown, compiled from the items' change notes.
  optional string changelog = 3;
  // Replaces the list.
  HowToTestList how_to_test = 4;
}

// Tester: your computer's result for a package, against one of its builds for
// your computer's platform. Submit needs a pass from every required computer on
// the current builds.
message ReleaseTest {
  string release_id = 1;
  // The computer you tested on; leave it empty when you test on one. A plain
  // string, as shipped: the tool takes it as optional (H-115).
  string machine = 2;
  // The sha256 of the build you tested.
  string build_sha256 = 3;
  // "pass", "fail" or "blocked".
  string result = 4;
  optional uint32 checks_passed = 5;
  optional uint32 checks_total = 6;
  optional string log_artifact = 7;
}

// DevOps: pause a rollout; testers holding its deploy tasks are told not to install.
message ReleasePause {
  string release_id = 1;
  // Why; the testers read it.
  string reason = 2;
}

// DevOps: resume a paused rollout.
message ReleaseResume {
  string release_id = 1;
}

// DevOps: call off a package that hasn't been submitted. It is removed and an
// event records it. A predecessor's shipped items stay in Owner testing for
// that package, which can then take a new successor; items from Verify are free.
message ReleaseCancel {
  string release_id = 1;
  // Why; kept in the event.
  optional string reason = 2;
}

// DevOps: add or replace one platform's build while the package is assembling.
message ReleaseAttachBuild {
  string release_id = 1;
  // e.g. "desktop-mac", "desktop-win", "ios", "daemon".
  string platform = 2;
  string version = 3;
  // Where the build is: a local path or an artifact path.
  string artifact = 4;
  // The build's sha256, 64 lowercase hex digits; installs are checked against it.
  string sha256 = 5;
  optional string url = 6;
  optional string install_url = 7;
  // The git commit it was built from (40 hex); the only one `release land`
  // and `release build-installer` accept (H-117, ARCH-R52 M1).
  optional string source_commit = 8;
}

// DevOps with the Publish extra: copy a build file into the served directory,
// hash it and attach it with its HTTPS url and install_url (H-020 §6.6).
// An .ipa also gets its itms-services manifest. A published file is never
// replaced by a different one.
message ReleasePublish {
  string release_id = 1;
  // Absolute path of the build file, under an allowed publish root.
  string file = 2;
  // Taken from the extension when omitted: .ipa "ios", .zip/.dmg "desktop-mac",
  // .exe/.msi "desktop-win".
  optional string platform = 3;
  // Defaults to the version of the platform's build already attached.
  optional string version = 4;
  // iOS only: the app's bundle identifier for the manifest.
  optional string bundle_id = 5;
  // The git commit it was built from (40 hex), as for ReleaseAttachBuild.
  optional string source_commit = 6;
}

// DevOps: freeze the package, move its items to Owner testing and ask the owner.
message ReleaseSubmit {
  string release_id = 1;
}

// DevOps: send an approved package to a machine; opens a task to its tester.
message ReleaseDeploy {
  string release_id = 1;
  string machine = 2;
}

// DevOps: take a package back off a machine; opens a task to its tester.
message ReleaseRollback {
  string release_id = 1;
  string machine = 2;
}

// Tester: the verified builds of the package DevOps tasked you to install.
message InstallRelease {
  string release_id = 1;
}

// Tester (or DevOps) installing a release on this computer: pause every
// project here first and reap what holds the home (start), read the pause
// (status), or end it if the install can't go ahead (resume). This computer
// only. Needs the owner-granted quiesce extra and the same gate as
// install_release. `hermesd release install` calls it for you.
message InstallQuiesce {
  string release_id = 1;
  // start, status, extend (push the deadline on during an install),
  // install_started (right before the handoff) or resume.
  string action = 2;
  // The version this computer will run; defaults to its build's.
  optional string version = 3;
  // install_started: the sha256 of the daemon binary being installed, which
  // a booting daemon compares with its own to tell install from rollback.
  optional string binary_sha256 = 4;
}

// Tester (or DevOps): how a deploy or rollback on a machine went.
message DeployConfirm {
  string release_id = 1;
  string machine = 2;
  // "ok", "failed", or "rolled_back" for a rollback.
  string result = 3;
  // "pass" or "fail".
  optional string smoke = 4;
  optional string log_artifact = 5;
}

// Who tests a release on which computer, and the computers a package must
// pass on before it is submitted: the list set, or every tester's computer.
message ReleaseMachines {
  string project_id = 1;
}

// Lead: set the computers a package must pass on, each one a tester tests
// on. An empty list goes back to every tester's computer.
message ReleaseMachinesSet {
  string project_id = 1;
  repeated string machines = 2;
}

// Lead: name this computer for its testers (ARCH-R55 S1). It is what a
// tester here tests on unless its role names a machine; not a linked
// computer's name.
message MachineNameSet {
  string project_id = 1;
  string name = 2;
}

// DevOps: close an approved package that a later, deployed release contains
// (H-121): its commit is in the later one's history (or, recorded before
// commits were, the later one builds every platform it built). No
// deployment is invented; its items go to Done.
message ReleaseDeployedVia {
  string release_id = 1;
  string via_release_id = 2;
}
