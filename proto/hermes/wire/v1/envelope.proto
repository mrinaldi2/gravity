// What a WebSocket binary frame carries (ADR-001 §1). Text frames stay the
// legacy JSON protocol v2; typed surfaces travel in binary frames, which a
// client uses only when `hello_ok.encodings` includes "proto".
syntax = "proto3";

package hermes.wire.v1;

import "hermes/board/v1/requests.proto";
import "hermes/home/v1/home.proto";

message Envelope {
  // Correlates a response with its request, as `req_id` does in JSON frames.
  uint64 req_id = 1;
  // One arm per typed surface's requests, responses and pushes. Field
  // numbers below 16 are kept for the busiest arms.
  oneof body {
    hermes.board.v1.BoardRequest board_request = 2;
    hermes.board.v1.BoardResponse board_response = 3;
    // Pushes carry `req_id` 0.
    hermes.board.v1.BoardPush board_push = 4;
    // The projects home (H-128).
    hermes.home.v1.HomeRequest home_request = 5;
    hermes.home.v1.HomeResponse home_response = 6;
    Error error = 15;
  }
}

message Error {
  // A stable code, as in JSON error frames ("unsupported", "invalid_request").
  string code = 1;
  string message = 2;
}
